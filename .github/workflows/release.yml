name: Build signed release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Validate release signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          missing=()
          for name in \
            RELEASE_KEYSTORE_BASE64 \
            RELEASE_STORE_PASSWORD \
            RELEASE_KEY_ALIAS \
            RELEASE_KEY_PASSWORD
          do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing GitHub Actions secret: %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
          test -s release-keystore.jks

      - name: Read and validate app version
        id: version
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"

          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Could not read versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi

          EXPECTED_TAG="v${VERSION_NAME}"
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Android versionName $VERSION_NAME. Expected $EXPECTED_TAG."
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "expected_tag=$EXPECTED_TAG" >> "$GITHUB_OUTPUT"

      - name: Run tests and build signed release APK
        env:
          TIBO_RELEASE_STORE_FILE: ${{ github.workspace }}/release-keystore.jks
          TIBO_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          TIBO_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          TIBO_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle clean test :app:assembleRelease --stacktrace

      - name: Package release files
        id: package
        shell: bash
        run: |
          SOURCE_APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          if [ -z "$SOURCE_APK" ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi

          mkdir -p dist
          OUTPUT_APK="dist/TiboButton-v${{ steps.version.outputs.version_name }}.apk"
          cp "$SOURCE_APK" "$OUTPUT_APK"
          sha256sum "$OUTPUT_APK" > dist/SHA256SUMS.txt

          echo "apk_path=$OUTPUT_APK" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found in ANDROID_HOME."
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "${{ steps.package.outputs.apk_path }}"

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v6
        with:
          name: TiboButton-v${{ steps.version.outputs.version_name }}-release
          path: |
            dist/TiboButton-v${{ steps.version.outputs.version_name }}.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "dist/TiboButton-v${{ steps.version.outputs.version_name }}.apk" \
              dist/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "dist/TiboButton-v${{ steps.version.outputs.version_name }}.apk" \
              dist/SHA256SUMS.txt \
              --verify-tag \
              --title "Tibo Button $GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: rm -f release-keystore.jks
